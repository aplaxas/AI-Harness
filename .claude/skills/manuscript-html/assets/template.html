<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<meta name="description" content="{{DESCRIPTION}}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&family=Noto+Serif+KR:wght@400;600;700&family=Outfit:wght@300;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #ffffff;
  --paper: #ffffff;
  --ink: #111111;
  --muted: #666666;
  --rule: #e2e2e2;
  --red: #c8161d;
  --red-deep: #8e1b1e;
  --panel: #c8161d;
  --panel-deep: #a3121a;
  --panel-ink: #ffffff;
  --th-bg: #f6f2f0;
  --callout-border: #cfc5bc;
  --fill-bg: #fff8e5;
  --fill-border: #d99a1e;
  --fill-ink: #7a4f00;
  --ws-bg: #fffdf6;
  --code-bg: #f2eee9;
  --label-ink: #ffffff;
  --shadow: 0 1px 2px rgba(0,0,0,.04), 0 8px 24px rgba(60,20,20,.06);
  --fs: 18px;
  --serif: 'Noto Serif KR', 'AppleMyungjo', 'Batang', serif;
  --sans: 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  --display: 'Outfit', 'Noto Sans KR', sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1e1e1e; --paper: #252526; --ink: #d4d4d4; --muted: #9d9d9d; --rule: #3c3c3c;
    --red: #ef5a5f; --red-deep: #f28b8b; --panel: #9e1419; --panel-deep: #7c0f14;
    --th-bg: #2d2d30; --callout-border: #4b4b4b; --fill-bg: #2b2415; --fill-border: #b9862a; --fill-ink: #f1c778;
    --ws-bg: #2a2a2b; --code-bg: #2d2d30; --label-ink: #1e1e1e; --shadow: 0 1px 2px rgba(0,0,0,.3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1e1e1e; --paper: #252526; --ink: #d4d4d4; --muted: #9d9d9d; --rule: #3c3c3c;
  --red: #ef5a5f; --red-deep: #f28b8b; --panel: #9e1419; --panel-deep: #7c0f14;
  --th-bg: #2d2d30; --callout-border: #4b4b4b; --fill-bg: #2b2415; --fill-border: #b9862a; --fill-ink: #f1c778;
  --ws-bg: #2a2a2b; --code-bg: #2d2d30; --label-ink: #1e1e1e; --shadow: 0 1px 2px rgba(0,0,0,.3);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--serif); font-size: var(--fs); line-height: 1.85;
  word-break: keep-all; overflow-wrap: anywhere; -webkit-font-smoothing: antialiased;
}
a { color: var(--red); text-decoration: none; }
a:hover { text-decoration: underline; }

/* toolbar */
.toolbar {
  position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 12px;
  padding: 0 20px; height: 52px; background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: saturate(1.4) blur(10px); -webkit-backdrop-filter: saturate(1.4) blur(10px);
  border-bottom: 1px solid var(--rule); font-family: var(--sans); font-size: 14px;
}
.crumb { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--muted); }
.crumb a { color: var(--muted); }
.crumb-sep { margin: 0 8px; opacity: .6; }
.tools { display: flex; gap: 4px; flex-shrink: 0; }
.tools button {
  font: 500 13px var(--sans); color: var(--ink); background: transparent; border: 1px solid transparent;
  border-radius: 8px; padding: 6px 10px; cursor: pointer; white-space: nowrap;
}
.tools button:hover { background: var(--paper); border-color: var(--rule); }
.tools button[aria-pressed="true"] { color: var(--red); border-color: var(--red); }
.progress { position: absolute; left: 0; right: 0; bottom: -1px; height: 3px; }
.progress span { display: block; height: 100%; width: 0; background: var(--red); transition: width .1s linear; }
[data-kind="index"] .only-section, [data-kind="title"] .only-section { display: none; }

/* opener */
.opener {
  max-width: 1180px; margin: 48px auto 0; padding: 0 24px;
  display: grid; grid-template-columns: 220px minmax(0, 740px); gap: 56px; justify-content: center;
}
.opener .chapter-head { grid-column: 2; }
.opener.no-toc { grid-template-columns: minmax(0, 740px); }
.opener.no-toc .chapter-head { grid-column: 1; }
.part-label { font: 300 44px/1.1 var(--display); letter-spacing: .02em; }

.chapter-head { min-width: 0; }
.chapter-kicker { font: 500 15px var(--display); color: var(--red-deep); letter-spacing: .04em; }
.chapter-line { display: flex; align-items: center; gap: 20px; margin-top: 2px; }
.chapter-num { font: 800 96px/0.9 var(--sans); color: var(--red-deep); letter-spacing: -.03em; }
.chapter-title { font: 700 30px/1.3 var(--sans); color: var(--red-deep); }
.section-title { font: 800 30px/1.35 var(--sans); margin: 40px 0 22px; color: var(--ink); }
.section-num { color: var(--red); margin-right: 6px; }
.section-title, .chapter-title, .content h2, .content h3 { text-wrap: balance; }
.lead p { margin: 0 0 1em; }
.keywords { margin-top: 30px; }

/* title page: part cover */
.cover-wrap { display: flex; justify-content: center; padding: 48px 24px 0; }
.part-panel {
  width: min(420px, 100%); aspect-ratio: 380 / 562;
  background: linear-gradient(170deg, var(--panel) 0%, var(--panel-deep) 100%); color: var(--panel-ink);
  padding: 44px 34px 34px; display: flex; flex-direction: column; text-align: center;
  box-shadow: 0 2px 4px rgba(0,0,0,.08), 0 18px 40px rgba(120,10,15,.22);
  -webkit-print-color-adjust: exact; print-color-adjust: exact;
}
.part-panel .part-label { font-size: 46px; }
.part-title { font: 800 32px/1.35 var(--sans); margin-top: 24px; }
.part-sub { font: 500 16px/1.5 var(--sans); margin-top: 10px; opacity: .85; }
.panel-sections {
  list-style: none; margin: auto 0 0; padding: 20px 0 0; text-align: left;
  border-top: 1px solid rgba(255,255,255,.4); font: 700 15px/1.5 var(--sans);
}
.panel-sections li { padding: 7px 0; opacity: .75; }
.panel-sections li a { color: inherit; }
.panel-sections li a:hover { text-decoration: underline; }
.panel-sections li.current { opacity: 1; font-weight: 800; }
.panel-sections li.current::before { content: "▸ "; font-size: .8em; }
.panel-sections li.todo { opacity: .45; }
.box-title {
  font: 700 16px var(--sans); margin: 0 0 12px; padding: 0 0 8px 12px; position: relative;
  border-bottom: 1.5px solid var(--ink);
}
.box-title::before { content: ""; position: absolute; left: 0; top: 3px; width: 3px; height: 16px; background: var(--red); }
.keywords ul { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px; }
.keywords li {
  font: 500 14px var(--sans); padding: 4px 12px; border-radius: 999px;
  background: var(--paper); border: 1px solid var(--rule);
}

/* body */
.layout {
  max-width: 1180px; margin: 64px auto 0; padding: 0 24px;
  display: grid; grid-template-columns: 220px minmax(0, 740px); gap: 56px; justify-content: center;
}
.layout.no-toc { grid-template-columns: minmax(0, 740px); }
.toc { position: sticky; top: 80px; align-self: start; font: 400 14px/1.5 var(--sans); max-height: calc(100vh - 100px); overflow: auto; }
.toc-title { font-weight: 700; color: var(--muted); font-size: 12px; letter-spacing: .08em; margin-bottom: 10px; }
.toc ol { list-style: none; margin: 0; padding: 0; border-left: 1px solid var(--rule); }
.toc li a { display: block; padding: 6px 12px; color: var(--muted); border-left: 2px solid transparent; margin-left: -1px; }
.toc li.lv3 a { padding-left: 26px; font-size: 13px; }
.toc li a:hover { color: var(--ink); text-decoration: none; }
.toc li a.active { color: var(--red); border-left-color: var(--red); font-weight: 700; }

.content h2 { font: 800 23px/1.4 var(--sans); color: var(--red-deep); margin: 2.4em 0 .8em; scroll-margin-top: 76px; }
.content h2:first-child { margin-top: 0; }
.content h3 { font: 700 19px/1.45 var(--sans); margin: 1.8em 0 .6em; scroll-margin-top: 76px; }
.content h4, .content h5, .content h6 { font: 700 17px var(--sans); margin: 1.4em 0 .5em; }
.content p { margin: 0 0 1.1em; }
.content ul, .content ol { padding-left: 1.3em; margin: 0 0 1.2em; }
.content li { margin: .3em 0; }
.content li::marker { color: var(--red); font-family: var(--sans); font-weight: 700; }
.content strong { font-weight: 700; }
.content li:has(> input[type="checkbox"]) { list-style: none; margin-left: -1.3em; }
.content code { font: .88em ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; background: var(--code-bg); padding: .1em .35em; border-radius: 4px; }
.content pre { background: var(--code-bg); padding: 16px 18px; border-radius: 8px; overflow: auto; line-height: 1.6; }
.content pre code { background: none; padding: 0; }
.content hr { border: 0; border-top: 1px solid var(--rule); margin: 2.4em 0; }
.content blockquote { margin: 1.4em 0; padding: 2px 0 2px 18px; border-left: 4px solid var(--rule); color: var(--muted); }
.content .inline-img { max-width: 100%; vertical-align: middle; }

p.interp { border-left: 3px solid var(--red); padding-left: 16px; }
p.interp::before {
  content: "내 해석"; display: block; font: 700 12px var(--sans); color: var(--red);
  letter-spacing: .06em; margin-bottom: 2px;
}

/* tables */
.table-wrap { overflow-x: auto; margin: 1.6em 0; }
table { width: 100%; border-collapse: collapse; font: 400 15px/1.6 var(--sans); }
th { text-align: left; background: var(--th-bg); border-top: 2px solid var(--red-deep); font-weight: 700; }
th, td { padding: 10px 12px; border-bottom: 1px solid var(--rule); vertical-align: top; }
.worksheet { margin: 1.6em 0; border: 1px solid var(--rule); border-radius: 10px; padding: 12px 14px 4px; background: var(--paper); }
.worksheet .table-wrap { margin: 8px 0; }
.ws-bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; font: 400 13px var(--sans); color: var(--muted); }
.ws-bar button { font: 500 12px var(--sans); color: var(--muted); background: none; border: 1px solid var(--rule); border-radius: 6px; padding: 3px 10px; cursor: pointer; }
.ws-bar button:hover { color: var(--red); border-color: var(--red); }
td.ws-cell { background: var(--ws-bg); height: 2.6em; outline: none; cursor: text; box-shadow: inset 0 0 0 1px transparent; }
td.ws-cell:focus { box-shadow: inset 0 0 0 2px var(--red); }
td.ws-cell:empty::before { content: "…"; color: var(--rule); }

/* figures */
.fig { margin: 2em 0; }
.fig-zoom {
  display: block; width: 100%; padding: 16px; background: #fff; border: 1px solid var(--rule);
  border-radius: 10px; cursor: zoom-in; box-shadow: var(--shadow);
}
.fig-zoom img { display: block; max-width: 100%; height: auto; margin: 0 auto; }
.fig figcaption { font: 400 14px/1.5 var(--sans); color: var(--muted); text-align: center; margin-top: 10px; }
.fig-num { font-weight: 700; color: var(--red-deep); margin-right: 4px; }

/* callouts */
.callout, .fill {
  margin: 1.8em 0; padding: 16px 20px 6px; border-radius: 12px; font-size: .94em;
  border: 1.5px solid var(--callout-border); background: var(--paper);
}
.callout-label {
  display: inline-block; font: 800 12.5px/1 var(--sans); letter-spacing: .04em; color: var(--label-ink);
  background: var(--red-deep); padding: 5px 9px; border-radius: 4px; margin-bottom: 10px;
}
.callout-tip .callout-label { background: var(--red); }
.callout-ask .callout-label { background: var(--ink); color: var(--bg); }
.callout-warn { border-color: var(--red); }
.callout-warn .callout-label { background: var(--red); }
.fill { border-style: dashed; border-color: var(--fill-border); background: var(--fill-bg); color: var(--fill-ink); }
.fill .callout-label { background: var(--fill-border); }
.hide-notes .fill { display: none; }

/* pager & footer */
.pager { max-width: 900px; margin: 72px auto 0; padding: 0 24px; display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.pager-card {
  display: flex; flex-direction: column; gap: 4px; padding: 16px 20px; border: 1px solid var(--rule);
  border-radius: 12px; background: var(--paper); font-family: var(--sans); color: var(--ink);
}
.pager-card.next { text-align: right; }
a.pager-card:hover { border-color: var(--red); text-decoration: none; }
.pager-card.disabled { opacity: .55; }
.pager-dir { font-size: 12px; color: var(--muted); letter-spacing: .04em; }
.pager-title { font-weight: 700; font-size: 16px; }
.page-foot { text-align: center; font: 400 13px var(--sans); color: var(--muted); padding: 48px 24px 56px; }
.page-foot .sep { margin: 0 12px; }

/* lightbox */
.lightbox { position: fixed; inset: 0; z-index: 50; background: rgba(10,8,8,.82); display: grid; place-items: center; padding: 24px; cursor: zoom-out; }
.lightbox[hidden] { display: none; }
.lightbox img { max-width: 96vw; max-height: 90vh; background: #fff; padding: 16px; border-radius: 8px; }

/* index page */
.book-hero { max-width: 1180px; margin: 48px auto 40px; padding: 0 24px; }
.book-hero .kicker { font: 500 15px var(--display); color: var(--red-deep); letter-spacing: .08em; }
.book-hero h1 { font: 800 46px/1.2 var(--sans); color: var(--red-deep); margin: 6px 0 18px; }
.book-progress { display: flex; align-items: center; gap: 14px; font: 500 14px var(--sans); color: var(--muted); }
.book-progress-bar { width: 220px; height: 6px; background: var(--rule); border-radius: 99px; overflow: hidden; }
.book-progress-bar span { display: block; height: 100%; background: var(--red); }
.book-toc { max-width: 1180px; margin: 0 auto; padding: 0 24px; }
.toc-part { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 40px; margin-bottom: 56px; }
.toc-part-panel {
  background: linear-gradient(170deg, var(--panel) 0%, var(--panel-deep) 100%); color: var(--panel-ink);
  padding: 28px; align-self: start; position: sticky; top: 76px;
  -webkit-print-color-adjust: exact; print-color-adjust: exact;
}
.toc-part-panel .part-label { font-size: 30px; }
.toc-part-panel h2 { font: 800 24px/1.35 var(--sans); margin: 14px 0 6px; }
.toc-part-panel p { font: 500 14px var(--sans); margin: 0; opacity: .85; }
.toc-chapter { margin-bottom: 26px; }
.toc-chapter h3 { font: 700 20px/1.4 var(--sans); color: var(--red-deep); margin: 0 0 8px; }
.toc-ch-num { font-weight: 800; font-size: 26px; margin-right: 12px; }
.toc-chapter ol { list-style: none; margin: 0; padding: 0; font: 400 15.5px/1.5 var(--sans); }
.toc-chapter li { padding: 8px 0; border-bottom: 1px dotted var(--rule); display: flex; align-items: baseline; gap: 10px; }
.toc-chapter li a { color: var(--ink); display: flex; gap: 10px; flex: 1; }
.toc-chapter li a:hover { color: var(--red); text-decoration: none; }
.sec-num { color: var(--red); font-weight: 700; min-width: 3em; }
.toc-chapter li.todo { color: var(--muted); }
.toc-chapter li.todo .sec-num { color: var(--muted); }
.toc-chapter li em { margin-left: auto; font: 500 12px var(--sans); font-style: normal; border: 1px solid var(--rule); border-radius: 99px; padding: 1px 8px; white-space: nowrap; }

/* responsive */
@media (max-width: 1000px) {
  .layout, .opener { grid-template-columns: minmax(0, 740px); }
  .opener .chapter-head { grid-column: 1; }
  .toc {
    position: fixed; top: 52px; right: 0; bottom: 0; width: min(300px, 86vw); max-height: none; z-index: 30;
    background: var(--paper); border-left: 1px solid var(--rule); padding: 20px; transform: translateX(100%);
    transition: transform .2s ease; box-shadow: var(--shadow);
  }
  .toc-open .toc { transform: none; }
}
@media (min-width: 1001px) { .toc-toggle { display: none; } }
@media (max-width: 860px) {
  .opener { margin-top: 28px; }
  .chapter-num { font-size: 72px; }
  .chapter-title { font-size: 24px; }
  .section-title { font-size: 25px; margin-top: 24px; }
  .toc-part { grid-template-columns: minmax(0, 1fr); gap: 18px; }
  .toc-part-panel { position: static; }
  .book-hero h1 { font-size: 34px; }
}
@media (max-width: 560px) {
  :root { --fs: 17px; }
  .toolbar { padding: 0 12px; gap: 6px; }
  .tools button { padding: 6px 7px; }
  .opener, .layout, .pager, .book-hero, .book-toc { padding: 0 16px; }
  .pager { grid-template-columns: 1fr; }
  .pager-card.next { text-align: left; }
}

/* print */
@page { margin: 18mm 16mm; }
@media print {
  :root { --fs: 11pt; }
  body { background: #fff; }
  .toolbar, .toc, .pager, .lightbox, .ws-bar button { display: none !important; }
  .layout { display: block; margin-top: 32px; }
  .opener { display: block; }
  .content h2 { break-after: avoid; }
  .fig, .callout, .fill, table { break-inside: avoid; }
  .fig-zoom { box-shadow: none; }
}
</style>
</head>
<body data-kind="{{PAGE_KIND}}" data-page="{{PAGE_ID}}">
<div class="toolbar">
  <div class="crumb">{{CRUMB}}</div>
  <div class="tools">
    <button type="button" class="toc-toggle only-section" data-act="toc">목차</button>
    <button type="button" data-act="smaller" aria-label="글자 작게">가−</button>
    <button type="button" data-act="bigger" aria-label="글자 크게">가+</button>
    <button type="button" class="only-section" data-act="notes" aria-pressed="false" title="✍️ 채우기 상자 숨기기">집필 메모 숨김</button>
    <button type="button" data-act="theme">어둡게</button>
    <button type="button" data-act="print">인쇄</button>
  </div>
  <div class="progress"><span></span></div>
</div>
{{MAIN}}
<div class="lightbox" hidden><img alt=""></div>
<script>
(() => {
  const root = document.documentElement;
  const page = document.body.dataset.page;
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
    del(k) { try { localStorage.removeItem(k); } catch (e) {} },
  };
  const $ = (s, el = document) => el.querySelector(s);
  const $$ = (s, el = document) => Array.from(el.querySelectorAll(s));
  const btn = (act) => $(`[data-act="${act}"]`);

  const isDark = () => (root.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')) === 'dark';
  const syncTheme = () => { btn('theme').textContent = isDark() ? '밝게' : '어둡게'; };
  const savedTheme = store.get('mh:theme');
  if (savedTheme) root.dataset.theme = savedTheme;
  syncTheme();
  btn('theme').addEventListener('click', () => {
    root.dataset.theme = isDark() ? 'light' : 'dark';
    store.set('mh:theme', root.dataset.theme);
    syncTheme();
  });

  let fs = Number(store.get('mh:fs')) || 0;
  const applyFs = () => { if (fs) root.style.setProperty('--fs', fs + 'px'); };
  applyFs();
  const stepFs = (d) => {
    const cur = fs || parseFloat(getComputedStyle(root).getPropertyValue('--fs')) || 18;
    fs = Math.min(24, Math.max(14, cur + d));
    applyFs();
    store.set('mh:fs', String(fs));
  };
  btn('smaller').addEventListener('click', () => stepFs(-1));
  btn('bigger').addEventListener('click', () => stepFs(1));

  const notes = btn('notes');
  const setNotes = (hide) => {
    document.body.classList.toggle('hide-notes', hide);
    notes.setAttribute('aria-pressed', String(hide));
    store.set('mh:hideNotes', hide ? '1' : '0');
  };
  setNotes(store.get('mh:hideNotes') === '1');
  notes.addEventListener('click', () => setNotes(!document.body.classList.contains('hide-notes')));

  btn('print').addEventListener('click', () => window.print());
  btn('toc').addEventListener('click', () => document.body.classList.toggle('toc-open'));
  $$('.toc a').forEach((a) => a.addEventListener('click', () => document.body.classList.remove('toc-open')));

  const bar = $('.progress span');
  const onScroll = () => {
    const h = document.documentElement;
    const max = h.scrollHeight - h.clientHeight;
    bar.style.width = (max > 0 ? (h.scrollTop / max) * 100 : 0) + '%';
  };
  addEventListener('scroll', onScroll, { passive: true });
  onScroll();

  const links = new Map($$('.toc a').map((a) => [decodeURIComponent(a.hash.slice(1)), a]));
  if (links.size && 'IntersectionObserver' in window) {
    const visible = new Set();
    const heads = $$('.content h2[id], .content h3[id]');
    const io = new IntersectionObserver((entries) => {
      entries.forEach((e) => (e.isIntersecting ? visible.add(e.target) : visible.delete(e.target)));
      let current = null;
      for (const h of heads) {
        if (h.getBoundingClientRect().top < innerHeight * 0.35) current = h; else break;
      }
      if (!current && visible.size) current = heads.find((h) => visible.has(h));
      links.forEach((a) => a.classList.remove('active'));
      if (current && links.get(current.id)) links.get(current.id).classList.add('active');
    }, { rootMargin: '-60px 0px -55% 0px', threshold: [0, 1] });
    heads.forEach((h) => io.observe(h));
  }

  const box = $('.lightbox');
  const boxImg = $('img', box);
  $$('.fig-zoom').forEach((b) => b.addEventListener('click', () => {
    const img = $('img', b);
    boxImg.src = img.src;
    boxImg.alt = img.alt;
    box.hidden = false;
  }));
  box.addEventListener('click', () => { box.hidden = true; });
  addEventListener('keydown', (e) => { if (e.key === 'Escape') { box.hidden = true; document.body.classList.remove('toc-open'); } });

  const wsKey = 'mh:ws:' + page;
  let ws = {};
  try { ws = JSON.parse(store.get(wsKey) || '{}') || {}; } catch (e) { ws = {}; }
  $$('.ws-cell').forEach((td) => {
    if (ws[td.dataset.cell]) td.textContent = ws[td.dataset.cell];
    td.addEventListener('input', () => {
      const v = td.textContent.trim();
      if (v) ws[td.dataset.cell] = v; else { delete ws[td.dataset.cell]; td.textContent = ''; }
      store.set(wsKey, JSON.stringify(ws));
    });
  });
  $$('.worksheet').forEach((w) => $('.ws-clear', w).addEventListener('click', () => {
    $$('.ws-cell', w).forEach((td) => { td.textContent = ''; delete ws[td.dataset.cell]; });
    Object.keys(ws).length ? store.set(wsKey, JSON.stringify(ws)) : store.del(wsKey);
  }));
})();
</script>
</body>
</html>
