<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>숫자의 규모 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* 강의 화면용. 숫자 하나 = 1mm 알갱이로 놓고 모델 크기를 실제 비율대로 비교한다. microgpt-3d-mini.html과 같은 디자인이다. */
:root {
  --bg: #0b1020;
  --panel: rgba(14, 20, 34, 0.88);
  --line: rgba(160, 190, 230, 0.18);
  --fg: #eef2f8;
  --muted: #93a6c2;
  --pos: #3d9bff;
  --neg: #ff4d5e;
  --prob: #ffb347;
  --sans: "IBM Plex Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--fg); font-family: var(--sans); overflow: hidden; }
#stage { position: fixed; inset: 0; }
#stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }

#labels { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
.lbl { position: absolute; left: 0; top: 0; white-space: nowrap; text-shadow: 0 1px 8px rgba(0,0,0,.95);
  transition: opacity .35s; transform: translate(-50%, -100%); text-align: center; }
.lbl b { display: block; font-size: 18px; font-weight: 700; }
.lbl span { display: block; font-size: 13px; color: var(--muted); font-family: var(--mono); }
.lbl.ref b { font-size: 15px; font-weight: 500; color: #c9d3e4; }

#head { position: fixed; top: 18px; left: 20px; max-width: min(560px, calc(100% - 40px)); }
.eyebrow { font-size: 13px; color: var(--muted); letter-spacing: .04em; }
h1 { font-size: 28px; line-height: 1.25; margin: 4px 0 6px; }
h1 em { font-style: normal; color: var(--prob); }
.sub { font-size: 15px; color: #c9d3e4; }

button { font: inherit; color: var(--fg); background: rgba(255,255,255,.06); border: 1px solid var(--line);
  border-radius: 10px; padding: 8px 16px; font-size: 15px; cursor: pointer; }
button:hover { background: rgba(255,255,255,.12); }

#card { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); width: min(820px, calc(100% - 32px));
  background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 18px 22px 16px;
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
#card .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
#card h2 { font-size: 24px; margin: 0; }
#card h2 b { font-family: var(--mono); color: var(--prob); }
#card p { font-size: 17px; line-height: 1.6; margin: 8px 0 12px; color: #d5dded; }
#card p b { color: var(--fg); }
.nav { display: flex; align-items: center; gap: 10px; }
.dots { display: flex; gap: 6px; }
.dots i { width: 8px; height: 8px; border-radius: 50%; background: #3a4660; cursor: pointer; }
.dots i.on { background: var(--prob); }
.foot { font-size: 12.5px; color: var(--muted); }

#tip { position: fixed; pointer-events: none; background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
  padding: 6px 10px; font-size: 13px; display: none; transform: translate(12px, 12px); }
#tip b { font-family: var(--mono); font-size: 18px; }

#modal { position: fixed; inset: 0; background: rgba(5, 8, 16, .72); display: none; align-items: center; justify-content: center; padding: 24px; }
#modal.show { display: flex; }
#modal .box { width: min(1200px, 100%); height: min(760px, 100%); display: flex; flex-direction: column;
  background: var(--panel); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
#modal .mtop { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
#mcap { font-size: 16px; line-height: 1.5; color: #d5dded; }
#mcap b { color: var(--prob); }
#modal iframe { flex: 1; border: 0; width: 100%; background: var(--bg); }

@media (max-width: 760px) {
  h1 { font-size: 21px; } .sub { font-size: 13px; } button { font-size: 13px; padding: 6px 10px; }
  #card { bottom: 0; width: 100%; border-radius: 14px 14px 0 0; padding: 12px 16px; }
  #card h2 { font-size: 18px; } #card p { font-size: 14px; }
  .lbl b { font-size: 14px; } .lbl span { font-size: 11px; }
  #modal { padding: 0; } #modal .box { border-radius: 0; height: 100%; }
}
</style>
</head>
<body>
<div id="stage"></div>
<div id="labels"></div>

<header id="head">
  <div class="eyebrow">1주차 · LLM 미니 모형</div>
  <h1>숫자 하나를 <em>1mm 알갱이</em>로 놓으면</h1>
  <div class="sub">크기는 실제 비율대로다. 알갱이나 큐브를 누르면 숫자 하나가 하는 일을 보여 준다.</div>
</header>

<section id="card">
  <div class="top">
    <h2 id="stitle"></h2>
    <div class="dots" id="dots"></div>
  </div>
  <p id="stext"></p>
  <div class="top">
    <div class="foot">숫자 하나 = 한 변 1mm 알갱이. 최상위 모델은 숫자 개수를 공개하지 않아서 1조 개로 가정했다.</div>
    <div class="nav"><button id="prev">◀ 이전</button><button id="next">다음 ▶</button></div>
  </div>
</section>
<div id="tip"></div>

<div id="modal">
  <div class="box">
    <div class="mtop"><div id="mcap"></div><button id="mclose">닫기 ✕</button></div>
    <iframe id="mframe" title="미니 GPT 3D"></iframe>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(() => {
  const V = (x, y, z) => new THREE.Vector3(x, y, z);
  const $ = id => document.getElementById(id);
  const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const col = n => new THREE.Color(css(n));
  const fmt = n => n.toLocaleString('ko-KR');

  // ---- mini의 숫자 184개를 같은 시드로 다시 만든다. 알갱이 i번 = mini의 선 i번
  let seed = 7;
  const rand = () => { seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  const gauss = () => { let u = 0; while (u === 0) u = rand(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * rand()); };
  const SIZE = { tok: 6, pos: 2, emb: 4, q: 4, k: 4, v: 4, mix: 4, attn: 4, mlp: 8, mlp2: 4, out: 6 };
  const MATS = [['tok', 'emb'], ['pos', 'emb'], ['emb', 'q'], ['emb', 'k'], ['emb', 'v'], ['mix', 'attn'], ['attn', 'mlp'], ['mlp', 'mlp2'], ['mlp2', 'out']];
  const MINI_W = [];
  for (const [a, b] of MATS) for (let o = 0; o < SIZE[b]; o++) for (let i = 0; i < SIZE[a]; i++) MINI_W.push(+(gauss() * 0.5).toFixed(2));

  // ---- 모델 (단위: mm). 알갱이 1개 = 1mm³
  const MODELS = [
    { key: 'mini', name: 'mini', n: 184 },
    { key: 'micro', name: 'microgpt', n: 4192 },
    { key: 'gpt2', name: 'GPT-2', n: 124e6 },
    { key: 'big', name: '1조 개 모델 (가정)', n: 1e12 },
  ];
  // 앞 큐브 오른쪽에 이어 놓는다. 사람은 GPT-2와 큰 큐브 사이에 선다
  let x = 0;
  const GAP = { mini: 0, micro: 6, gpt2: 100, big: 1300 };
  for (const m of MODELS) { m.side = Math.cbrt(m.n); m.x0 = x + GAP[m.key]; x = m.x0 + m.side; m.center = V(m.x0 + m.side / 2, m.side / 2, 0); }
  const [MINI, MICRO, GPT2, BIG] = MODELS;
  const PERSON_X = GPT2.x0 + GPT2.side + 650;

  // ---- 렌더러·카메라 (mm에서 10m까지 오가므로 near/far는 매 프레임 거리에 맞춘다)
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.outputEncoding = THREE.sRGBEncoding;
  $('stage').appendChild(renderer.domElement);
  const scene = new THREE.Scene(); scene.background = col('--bg');
  const camera = new THREE.PerspectiveCamera(38, 1, 0.1, 1e6);
  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true; controls.dampingFactor = 0.08; controls.screenSpacePanning = true;
  controls.minDistance = 5; controls.maxDistance = 2e5;
  scene.add(new THREE.HemisphereLight(0xffffff, 0x223355, 0.75));
  const sun = new THREE.DirectionalLight(0xffffff, 0.8); sun.position.set(-0.6, 1, 0.8); scene.add(sun);

  // ---- 알갱이: 아래층부터 채운다. 마지막 층이 덜 찬 것도 그대로 보인다
  const POS = col('--pos'), NEG = col('--neg');
  function grains(m, per, signOf) {
    const g = new THREE.BoxGeometry(0.82, 0.82, 0.82);
    const mesh = new THREE.InstancedMesh(g, new THREE.MeshStandardMaterial({ roughness: 0.5 }), m.n);
    const mat = new THREE.Matrix4(), c = new THREE.Color();
    for (let i = 0; i < m.n; i++) {
      const ix = i % per, iz = Math.floor(i / per) % per, iy = Math.floor(i / (per * per));
      mat.setPosition(m.x0 + ix + 0.5, iy + 0.5, iz + 0.5 - per / 2);
      mesh.setMatrixAt(i, mat); mesh.setColorAt(i, c.copy(signOf(i) >= 0 ? POS : NEG));
    }
    mesh.userData.model = m; scene.add(mesh); return mesh;
  }
  const miniMesh = grains(MINI, 6, i => MINI_W[i]);
  const microMesh = grains(MICRO, 16, () => rand() - 0.5);
  MINI.side = 6; MINI.center = V(MINI.x0 + 3, 3, 0);   // 6×6에 5층 남짓으로 쌓인다
  MICRO.side = 16; MICRO.center = V(MICRO.x0 + 8, 8, 0);

  // 알갱이 1억 개부터는 그릴 수 없어서 덩어리로 그린다
  const blocks = [GPT2, BIG].map(m => {
    const geo = new THREE.BoxGeometry(m.side, m.side, m.side);
    const mesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color: '#2f6fd0', roughness: 0.6, transparent: true, opacity: 0.88 }));
    mesh.position.copy(m.center); mesh.userData.model = m; scene.add(mesh);
    const edges = new THREE.LineSegments(new THREE.EdgesGeometry(geo), new THREE.LineBasicMaterial({ color: '#9cc8ff' }));
    edges.position.copy(m.center); scene.add(edges);
    return mesh;
  });

  // ---- 크기 기준: 100원 동전(지름 24mm)과 사람(1.7m)
  const REF = new THREE.MeshStandardMaterial({ color: '#c9ced8', roughness: 0.45, metalness: 0.3 });
  const coin = new THREE.Mesh(new THREE.CylinderGeometry(12, 12, 1.5, 48), REF);
  coin.rotation.x = Math.PI / 2; coin.position.set(-18, 12, 0); scene.add(coin);
  const person = new THREE.Group(), PM = new THREE.MeshStandardMaterial({ color: '#c9ced8', roughness: 0.7 });
  for (const dx of [-90, 90]) { const leg = new THREE.Mesh(new THREE.CylinderGeometry(70, 70, 850, 16), PM); leg.position.set(dx, 425, 0); person.add(leg); }
  const body = new THREE.Mesh(new THREE.CylinderGeometry(190, 160, 620, 20), PM); body.position.y = 1160; person.add(body);
  const headM = new THREE.Mesh(new THREE.SphereGeometry(115, 20, 14), PM); headM.position.y = 1585; person.add(headM);
  person.position.set(PERSON_X, 0, 0); scene.add(person);
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(1e5, 1e5), new THREE.MeshBasicMaterial({ color: '#111a2e' }));
  ground.rotation.x = -Math.PI / 2; ground.position.set(5000, -0.05, 0); scene.add(ground);

  // ---- 라벨
  const labels = [];
  function label(html, p, cls = '') {
    const el = document.createElement('div'); el.className = 'lbl ' + cls; el.innerHTML = html;
    $('labels').appendChild(el); const l = { el, p }; labels.push(l); return l;
  }
  const sideText = s => s >= 1000 ? `한 변 ${(s / 1000).toFixed(1)}m` : s >= 100 ? `한 변 ${Math.round(s / 10)}cm` : `한 변 ${Math.round(s)}mm`;
  for (const m of MODELS) m.lbl = label(`<b>${m.name}</b><span>${fmt(m.n)}개 · ${sideText(Math.cbrt(m.n))}</span>`, V(m.center.x, m.center.y * 2 + m.side * 0.08, 0));
  const coinL = label('<b>100원 동전</b>', V(coin.position.x, 25, 0), 'ref');
  const personL = label('<b>사람 1.7m</b>', V(PERSON_X, 1800, 0), 'ref');

  // ---- 단계 (frame: 화면에 들어와야 할 영역의 가운데와 크기)
  const STEPS = [
    { title: `mini <b>${fmt(MINI.n)}</b>개`, frame: { c: V(-6, 7, 0), w: 52, h: 30 },
      text: '앞에서 본 mini 모델의 숫자 184개다. 숫자 하나를 1mm 알갱이로 놓으면 100원 동전 옆에 손톱만큼 쌓인다. <b>알갱이를 누르면 그 숫자가 mini 그림의 어느 선인지 보여 준다.</b>' },
    { title: `microgpt <b>${fmt(MICRO.n)}</b>개`, frame: { c: V(9, 10, 0), w: 70, h: 30 },
      text: 'microgpt는 숫자 4,192개다. mini의 약 23배이고, 티스푼 하나쯤 된다. 이름을 붙일 수 있는 크기는 여기까지다.' },
    { title: `GPT-2 <b>약 1억 2,400만</b>개`, frame: { c: V(700, 900, 0), w: 2400, h: 2000 },
      text: '2019년에 나온 GPT-2의 가장 작은 판이다. 한 변 50cm, 욕조 절반이 넘는 양이다. microgpt 티스푼이 약 3만 번 들어간다. 왼쪽 아래의 점 두 개가 앞의 두 모델이다.' },
    { title: `1조 개 모델 <b>(가정)</b>`, frame: { c: V(BIG.center.x - 1200, 5200, 0), w: 14500, h: 11500 },
      text: '요즘 최상위 모델은 숫자 개수를 공개하지 않는다. 1조 개라고 가정하면 한 변 10m, 3층 건물 높이의 큐브가 된다. GPT-2 큐브가 약 8,000개 들어간다. 모든 알갱이가 mini의 선 하나처럼 곱하고 더해진다.' },
  ];
  let step = 0;
  STEPS.forEach((s, i) => { const d = document.createElement('i'); d.onclick = () => goStep(i); $('dots').appendChild(d); s.dot = d; });
  function render() {
    const s = STEPS[step];
    $('stitle').innerHTML = s.title; $('stext').innerHTML = s.text;
    STEPS.forEach((t, i) => t.dot.classList.toggle('on', i === step));
    $('prev').disabled = step === 0; $('next').textContent = step === STEPS.length - 1 ? '처음으로 ↺' : '다음 ▶';
    // 멀어져 점이 된 것의 라벨은 서로 겹치므로 지금 것과 바로 앞 것만 보인다
    MODELS.forEach((m, i) => { m.lbl.on = i <= step && i >= step - 1; });
    coinL.on = step <= 1; personL.on = step >= 2;
  }
  function goStep(i) { step = (i + STEPS.length) % STEPS.length; render(); go(step); }
  $('next').onclick = () => goStep(step + 1);
  $('prev').onclick = () => goStep(step - 1);
  addEventListener('keydown', e => {
    if ($('modal').classList.contains('show')) { if (e.key === 'Escape') closeModal(); return; }
    if (['ArrowRight', 'PageDown', ' '].includes(e.key)) { e.preventDefault(); goStep(step + 1); }
    if (['ArrowLeft', 'PageUp'].includes(e.key)) { e.preventDefault(); if (step > 0) goStep(step - 1); }
  });

  // ---- 카메라 이동. 거리는 로그로 보간해야 mm에서 m로 빠질 때 한 번에 튀지 않는다
  const DIR = V(-0.55, 0.42, 1).normalize();
  let area = { h: innerHeight, full: innerHeight };
  function dist(f) {
    const t = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
    return Math.max(f.h * area.full / area.h, f.w * area.full / innerWidth) / (2 * t) * 1.05;
  }
  let fly = null;
  function go(i) {
    const f = STEPS[i].frame;
    fly = { t0: performance.now(), dur: 1800, a: controls.target.clone(), b: f.c.clone(),
      d0: camera.position.clone().sub(controls.target).normalize(), l0: camera.position.distanceTo(controls.target), l1: dist(f) };
  }
  controls.addEventListener('start', () => { fly = null; });
  const ease = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;

  // 장면 중심을 제목과 카드 사이 빈 곳으로 옮긴다 (mini와 같은 방식)
  function resize() {
    const w = innerWidth, h = innerHeight;
    renderer.setSize(w, h);
    const headB = $('head').getBoundingClientRect().bottom, cardT = $('card').getBoundingClientRect().top;
    const s = Math.round((headB + cardT) / 2 - h / 2);
    area.h = Math.max(160, cardT - headB); area.full = h + 2 * Math.abs(s);
    camera.aspect = w / area.full;
    camera.setViewOffset(w, area.full, 0, s > 0 ? 0 : 2 * -s, w, h);
    camera.updateProjectionMatrix();
  }

  // ---- 알갱이·큐브 누르기 → mini 그림을 창으로 연다
  const ray = new THREE.Raycaster(), mouse = new THREE.Vector2(), tip = $('tip');
  const pickables = [miniMesh, microMesh, ...blocks];
  function hit(e) {
    mouse.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
    ray.setFromCamera(mouse, camera);
    return ray.intersectObjects(pickables)[0];
  }
  function openModal(line, cap) {
    $('mcap').innerHTML = cap;
    $('mframe').src = `microgpt-3d-mini.html?embed=1&line=${line}`;
    $('modal').classList.add('show');
  }
  function closeModal() { $('modal').classList.remove('show'); $('mframe').src = 'about:blank'; }
  $('mclose').onclick = closeModal;
  $('modal').onclick = e => { if (e.target === $('modal')) closeModal(); };

  let down = null;
  renderer.domElement.addEventListener('pointerdown', e => { down = { x: e.clientX, y: e.clientY }; });
  renderer.domElement.addEventListener('pointerup', e => {
    if (!down || Math.hypot(e.clientX - down.x, e.clientY - down.y) > 5) return;
    const h = hit(e); if (!h) return;
    const m = h.object.userData.model;
    if (m === MINI) {
      const i = h.instanceId;
      openModal(i, `mini의 알갱이 ${i + 1}번 = mini 그림의 <b>흰 선 하나</b>. 숫자 184개가 모두 이런 선이다.`);
    } else {
      openModal(Math.floor(Math.random() * MINI_W.length),
        `${m.name}의 알갱이 하나도 mini의 <b>흰 선 하나</b>와 같은 일을 한다. 들어온 숫자에 곱해져 다음 칸으로 더해진다. 이런 숫자가 ${fmt(m.n)}개다.`);
    }
  });
  renderer.domElement.addEventListener('pointermove', e => {
    const h = hit(e);
    if (!h) { tip.style.display = 'none'; renderer.domElement.style.cursor = ''; return; }
    const m = h.object.userData.model;
    tip.innerHTML = m === MINI ? `숫자 하나 <b>${(MINI_W[h.instanceId] >= 0 ? '+' : '−') + Math.abs(MINI_W[h.instanceId]).toFixed(2)}</b><br>누르면 mini 그림에서 보기`
      : `${m.name} · ${fmt(m.n)}개<br>누르면 숫자 하나가 하는 일 보기`;
    tip.style.display = 'block'; tip.style.left = e.clientX + 'px'; tip.style.top = e.clientY + 'px';
    renderer.domElement.style.cursor = 'pointer';
  });

  render();
  addEventListener('resize', () => { resize(); go(step); }); resize();
  controls.target.copy(STEPS[0].frame.c); camera.position.copy(STEPS[0].frame.c).addScaledVector(DIR, dist(STEPS[0].frame));

  const tmp = new THREE.Vector3();
  function frame(now) {
    if (fly) {
      const t = Math.min(1, (now - fly.t0) / fly.dur), e = ease(t);
      controls.target.lerpVectors(fly.a, fly.b, e);
      const d = Math.exp(Math.log(fly.l0) + (Math.log(fly.l1) - Math.log(fly.l0)) * e);
      camera.position.copy(controls.target).addScaledVector(fly.d0.clone().lerp(DIR, e).normalize(), d);
      if (t >= 1) fly = null;
    }
    controls.update();
    const d = camera.position.distanceTo(controls.target);
    camera.near = d / 200; camera.far = d * 200; camera.updateProjectionMatrix();

    // 제목 영역과 카드 위에 겹치는 라벨은 숨긴다
    const w = innerWidth, h = innerHeight, hd = $('head').getBoundingClientRect(), cd = $('card').getBoundingClientRect();
    for (const l of labels) {
      tmp.copy(l.p).project(camera);
      const x = (tmp.x + 1) / 2 * w, y = (1 - tmp.y) / 2 * h;
      const covered = (x < hd.right + 20 && y < hd.bottom + 10) || (y > cd.top - 6 && x > cd.left - 20 && x < cd.right + 20);
      const vis = l.on !== false && tmp.z < 1 && !covered;
      l.el.style.opacity = vis ? 1 : 0;
      if (vis) l.el.style.left = x.toFixed(1) + 'px', l.el.style.top = y.toFixed(1) + 'px';
    }
    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
