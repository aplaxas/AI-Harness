      <path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/>
    </marker>
  </defs>
  <rect width="860" height="290" fill="#FFFFFF"/>
  <text x="430" y="36" text-anchor="middle" font-size="18" font-weight="700" fill="#111827">업무 한 건에서 AI와 사람이 맡는 부분</text>

  <rect x="30" y="70" width="170" height="90" rx="10" fill="#E8F0FE" stroke="#3B6FD8" stroke-width="2"/>
  <text x="115" y="108" text-anchor="middle" font-size="16" font-weight="700" fill="#1F2937">목적·자료 정하기</text>
  <text x="115" y="134" text-anchor="middle" font-size="13" fill="#3B6FD8">사람</text>

  <rect x="240" y="70" width="170" height="90" rx="10" fill="#FFF1E0" stroke="#E08A1E" stroke-width="2"/>
  <text x="325" y="108" text-anchor="middle" font-size="16" font-weight="700" fill="#1F2937">초안 만들기</text>
  <text x="325" y="134" text-anchor="middle" font-size="13" fill="#B86A0C">AI</text>

  <rect x="450" y="70" width="170" height="90" rx="10" fill="#E8F0FE" stroke="#3B6FD8" stroke-width="2"/>
  <text x="535" y="108" text-anchor="middle" font-size="16" font-weight="700" fill="#1F2937">사실 확인·결정</text>
  <text x="535" y="134" text-anchor="middle" font-size="13" fill="#3B6FD8">사람</text>

  <rect x="660" y="70" width="170" height="90" rx="10" fill="#E8F0FE" stroke="#3B6FD8" stroke-width="2"/>
  <text x="745" y="108" text-anchor="middle" font-size="16" font-weight="700" fill="#1F2937">보내기·제출하기</text>
  <text x="745" y="134" text-anchor="middle" font-size="13" fill="#3B6FD8">사람</text>

  <line x1="200" y1="115" x2="238" y2="115" stroke="#4B5563" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="410" y1="115" x2="448" y2="115" stroke="#4B5563" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="620" y1="115" x2="658" y2="115" stroke="#4B5563" stroke-width="2" marker-end="url(#arrow)"/>

  <path d="M535,160 C535,215 325,215 325,164" fill="none" stroke="#4B5563" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <text x="430" y="226" text-anchor="middle" font-size="13" fill="#4B5563">고칠 점을 알려 주고 다시 요청</text>

  <rect x="290" y="252" width="16" height="16" rx="3" fill="#E8F0FE" stroke="#3B6FD8" stroke-width="2"/>
  <text x="314" y="265" font-size="13" fill="#1F2937">사람이 판단하는 일</text>
  <rect x="460" y="252" width="16" height="16" rx="3" fill="#FFF1E0" stroke="#E08A1E" stroke-width="2"/>
  <text x="484" y="265" font-size="13" fill="#1F2937">AI에 맡기는 일</text>
